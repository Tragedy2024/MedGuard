version: 1
checked_on: '2026-11-17'
topics:
  lung_cancer:
    entity: 肺癌
    intent: disease
    aliases: [肺癌]
    fields:
      overview:
        title: 肺癌的基本情况
        summary: 肺癌是发生在肺部的癌症。了解肺癌时需要区分具体类型和分期，不能仅凭咳嗽等症状自行确诊。
        items:
          - title: 主要类型
            text: 主要分为非小细胞肺癌和小细胞肺癌，前者更常见。不同类型的细胞特点、病情发展及治疗选择可能不同。
            source: NCI公开患者资料
            url: https://www.cancer.gov/types/lung/patient/non-small-cell-lung-treatment-pdq
            original_title: Non-Small Cell Lung Cancer Treatment (PDQ)–Patient Version
          - title: 诊断与分期
            text: 需要结合肺部影像和必要的组织病理等检查判断是否为肺癌、属于什么类型以及是否扩散，具体由医生评估。
            source: NCI公开患者资料
            url: https://www.cancer.gov/types/lung/patient/non-small-cell-lung-treatment-pdq
            original_title: Non-Small Cell Lung Cancer Treatment (PDQ)–Patient Version
        advice: 这些是通用资料，不代表个人诊断；已有检查报告时可向医生核对类型和分期。
      classification:
        title: 肺癌的主要类型
        summary: 肺癌主要分为非小细胞肺癌和小细胞肺癌，具体类型需结合病理等检查确定。
        items:
          - title: 非小细胞肺癌与小细胞肺癌
            text: 非小细胞肺癌更常见，其中还可分为腺癌、鳞状细胞癌等；分类不能仅凭症状自行判断。
            source: NCI公开患者资料
            url: https://www.cancer.gov/types/lung/patient/non-small-cell-lung-treatment-pdq
            original_title: Non-Small Cell Lung Cancer Treatment (PDQ)–Patient Version
        advice: 请结合原始病理报告向医生核对具体类型。
  sore_throat:
    entity: 喉咙痛
    intent: symptom
    aliases: [喉咙痛, 喉咙疼, 嗓子痛, 嗓子疼, 咽痛, 咽喉痛, 咽喉疼痛]
    fields:
      triage:
        title: 喉咙痛的初步说明
        summary: 喉咙痛是一种症状，仅凭这句话不能确定病因。疼了多久，有没有发热、咳嗽，吞咽或呼吸是否受影响？
        items:
          - title: 可以先采取的一般措施
            text: 注意休息，适量喝水，选择容易吞咽的柔软或偏凉食物，避免吸烟及烟雾刺激；不要自行使用抗生素。
            source: NHS公开健康资料
            url: https://www.nhs.uk/symptoms/sore-throat/
            original_title: Sore throat
          - title: 就医提示
            text: 如果持续一周仍未改善或反复发作，应就医评估；出现呼吸困难、无法吞咽口水或严重症状迅速加重，应立即就医。
            source: NHS公开健康资料
            url: https://www.nhs.uk/symptoms/sore-throat/
            original_title: Sore throat
        advice: 请先补充持续多久、是否发热和吞咽情况；是否需要药物应由医生或药师结合个人情况判断。
  pneumonia:
    entity: 肺炎
    intent: disease
    aliases: [肺炎]
    fields:
      overview:
        title: 肺炎是什么
        summary: 肺炎是肺部的炎症，通常由感染引起，细菌和病毒感染都是常见原因。具体病因和严重程度需要结合症状与检查评估。
        items:
          - title: 可能伴随的表现
            text: 可出现咳嗽、发热、气短或明显疲倦等表现，但不能仅凭这些表现自行确诊肺炎。
            source: NHS公开健康资料
            url: https://www.nhs.uk/conditions/pneumonia/
            original_title: Pneumonia
        advice: 如果是在咨询自身情况，请补充症状、持续多久以及是否已有医生诊断；严重呼吸困难等紧急情况应立即就医。
  dizziness:
    entity: 头晕
    intent: symptom
    aliases: [头晕, 头昏, 眩晕, 脑袋晕, 晕得慌]
    fields:
      triage:
        title: 头晕需要结合具体表现判断
        summary: 头晕是一种症状，单凭“头晕”不能确定是哪一种病。你感觉是天旋地转、快要晕倒，还是走路不稳？从什么时候开始，持续多久，是否反复？
        items:
          - title: 病因需要结合其他表现评估
            text: 头晕可能与多种情况有关，例如脱水、药物影响或内耳问题，不能仅凭这个症状自行判断病因。
            source: NHS公开健康资料
            url: https://www.nhs.uk/symptoms/dizziness/
            original_title: Dizziness
          - title: 当前注意事项
            text: 头晕时避免开车、登高或操作机器；如果持续不缓解、反复发生或伴有其他不适，应就医评估。
            source: NHS公开健康资料
            url: https://www.nhs.uk/symptoms/dizziness/
            original_title: Dizziness
        advice: 请先说明开始时间、持续多久及伴随不适，再进一步讨论就诊方向；若同时出现急症警示症状，应立即就医。
  abdominal_pain:
    entity: 腹痛
    intent: symptom
    aliases: [腹痛, 肚子疼, 肚子痛, 肚子疼痛]
    fields:
      triage:
        title: 先了解腹痛的部位和经过
        summary: 腹痛可能有多种原因，单凭“肚子疼”不能确定病因或直接指定一个科室。是哪个部位疼，从什么时候开始、持续多久，是持续疼痛还是一阵一阵，是否伴有呕吐、腹泻或其他不适？
        items:
          - title: 就诊方向需要结合具体情况
            text: 持续或反复腹痛应就医评估；尚不清楚具体部位和伴随表现时，可先向医院导诊台或全科咨询，不要自行诊断。
            source: NHS公开健康资料
            url: https://www.nhs.uk/symptoms/stomach-ache/
            original_title: Stomach ache
          - title: 需要立即就医的表现
            text: 突然出现剧烈腹痛、呕血、大量便血或黑色黏便、完全不能排便排气等情况，应立即就医。
            source: NHS公开健康资料
            url: https://www.nhs.uk/symptoms/stomach-ache/
            original_title: Stomach ache
        advice: 请先补充疼痛部位、持续多久和伴随症状，便于进一步说明就诊方向。
  high_glucose:
    entity: 血糖
    intent: lab
    aliases: [血糖高, 高血糖, 血糖偏高, 血糖升高]
    fields:
      treatments:
        title: 血糖升高的一般处理与治疗
        summary: 血糖升高不等于已经确诊糖尿病。需要结合实际数值、单位、空腹或餐后、症状和既往诊断确定处理方式；以下是一般信息，不是针对个人的治疗方案。
        items:
          - title: 先评估原因和检测条件
            text: 记录测量值、测量时间和近期饮食、活动及用药情况，交由医生判断是否需要复查或进一步检查。
            source: 国家卫生健康委公开健康问答
            url: https://www.nhc.gov.cn/xcs/nwwd/202003/8ab7b8e56fd048aaa471768a892e3509.shtml
            original_title: 患者可以自己调整降糖方案吗？什么情况下必须立即就医？
          - title: 生活方式与必要的药物治疗
            text: 对已确诊糖尿病的管理，健康饮食、适当身体活动和血糖监测是基础；是否需要药物以及选择哪种药物，取决于糖尿病类型和个人健康状况。不能仅凭一句“血糖高”决定用药。
            source: NIDDK公开健康资料
            url: https://www.niddk.nih.gov/health-information/diabetes/overview/insulin-medicines-treatments
            original_title: Insulin, Medicines, & Other Diabetes Treatments
        advice: 不要自行停药、加量或更换降糖方案。如血糖异常伴明显呕吐、意识改变或呼吸困难，应立即就医。
      drugs:
        title: 降糖药物的通用信息
        summary: 不能根据“高血糖”三个字直接推荐某一种药或剂量。需要先明确是否为糖尿病、具体类型和身体状况；以下只介绍治疗类别。
        items:
          - title: 口服药与注射药物
            text: 糖尿病治疗可涉及二甲双胍等口服药，以及胰岛素等注射药物。不同类型和健康状况的适用方案不同；并非所有血糖升高都需要同一种药。
            source: NIDDK公开健康资料
            url: https://www.niddk.nih.gov/health-information/diabetes/overview/insulin-medicines-treatments
            original_title: Insulin, Medicines, & Other Diabetes Treatments
          - title: 选药前需要评估
            text: 应由医生结合病情、其他疾病、现有用药与不良反应风险决定用药。不要自行购买、试服、停用或调整降糖药。
            source: NIDDK公开健康资料
            url: https://www.niddk.nih.gov/health-information/diabetes/overview/insulin-medicines-treatments
            original_title: Insulin, Medicines, & Other Diabetes Treatments
        advice: 带上血糖记录和现有药单咨询医生；不能据此自行选择药物或剂量。
  glucose_department:
    entity: 血糖异常
    intent: lab
    aliases: [血糖, 高血糖]
    fields:
      department:
        title: 血糖异常的就诊方向
        summary: 如果是血糖监测异常、复查或降糖方案问题，可以向内分泌科咨询；具体挂号仍以医院导诊安排和症状为准。
        items:
          - title: 内分泌科
            text: 可携带血糖测量记录和正在使用的药物清单咨询。出现意识改变、明显呕吐、呼吸困难等情况时，应及时急诊就医。
            source: 国家卫生健康委公开健康问答
            url: https://www.nhc.gov.cn/xcs/nwwd/202003/8ab7b8e56fd048aaa471768a892e3509.shtml
            original_title: 患者可以自己调整降糖方案吗？什么情况下必须立即就医？
        advice: 请补充具体数值、单位、测量时间、是否空腹以及有无其他不适，便于进一步说明。
  abdominal_discomfort:
    entity: 腹部不适
    intent: symptom
    aliases: [肚子不舒服, 肚子难受, 腹部不适, 腹部不舒服, 胃不舒服]
    fields:
      triage:
        title: 先了解腹部不适的具体情况
        summary: 你描述的是腹部不适，不能仅凭这句话判断病因或确定科室。请说说具体部位、不舒服多久，是疼痛、腹胀、恶心还是腹泻，以及是否持续加重。
        items:
          - title: 稳定情况下的就诊方向
            text: 如果没有急症表现，可以先向医院导诊台或全科咨询；持续或反复不适应就医评估，不要仅凭症状自己诊断。
            source: NHS公开健康资料
            url: https://www.nhs.uk/symptoms/stomach-ache/
            original_title: Stomach ache
          - title: 需要立即就医的情况
            text: 突然出现剧烈腹痛、呕血、黑色黏便、大量便血或完全不能排便排气等情况，应及时急诊就医。
            source: NHS公开健康资料
            url: https://www.nhs.uk/symptoms/stomach-ache/
            original_title: Stomach ache
        advice: 请先补充部位、持续多久和伴随症状；若突然剧烈腹痛、呕血或有其他严重不适，请立即就医。
  cefuroxime:
    entity: 头孢呋辛
    intent: medication
    aliases: [头孢呋辛, 头孢呋辛酯]
    fields:
      overview:
        title: 头孢呋辛是什么
        summary: 头孢呋辛是一种头孢菌素类抗生素，用于医生判断适用的某些细菌感染，不能把它当作适用于所有炎症的通用药。
        items:
          - title: 作用与适用范围
            text: 它通过抑制细菌生长发挥作用，不能治疗普通感冒、流感等病毒感染。是否适用需要医生判断。
            source: MedlinePlus药品资料
            url: https://medlineplus.gov/druginfo/meds/a601206.html
            original_title: Cefuroxime
        advice: 按处方和具体药品说明书服用；有药物过敏史、肝肾疾病或正在服用其他药物时，先告知医生或药师。
