# 智慧医生 · 医院审核知识库（演示仿真版）
#
# 角色定位：这是"医院审核的医学知识"——由医院专业人员审核定稿的静态
# 知识，不是模型生成的内容。智慧医生把「院内数据」与「知识库解读」并列
# 展示并分别标注来源，正是产品差异点（智慧医生.docx）。
#
# 本文件覆盖演示库中出现的全部检验项 / 药品 / 常见症状 / 常见诊断。
# 新增内容时保持 YAML 结构不变即可，后端 smart_doctor.py 自动加载。
#
# 数值区间：
#   normal 为展示用参考范围；
#   ranges 按 result_value 数值分档（max 表示 <=max，min 表示 >=min，
#   档位从上到下匹配，任一命中即止）。

version: 1

lab_tests:
  血糖:
    desc: 反映血液中的葡萄糖浓度，糖尿病诊断与随访的核心指标
    unit: mmol/L
    normal: 3.9–6.1（空腹）
    ranges:
      - {max: 3.9, label: 偏低, text: 低于空腹正常下限，可能是空腹时间过长、饮食不足或药物影响，也可能提示低血糖。}
      - {min: 3.9, max: 6.1, label: 正常, text: 在空腹正常范围内，本次结果未见异常。}
      - {min: 6.1, max: 7.0, label: 偏高（空腹血糖受损）, text: 高于正常上限但未达糖尿病诊断标准，提示空腹血糖受损，属于糖尿病前期信号。}
      - {min: 7.0, label: 显著偏高, text: 达到糖尿病诊断参考标准，建议由内分泌科医生复核并安排进一步检查（如糖化血红蛋白、糖耐量试验）。}
    advice_common:
      - 如为复查，请与上次结果对比趋势；连续偏高建议记录饮食与用药情况
    urgent_text: 若同时出现明显口渴、多饮多尿、体重不明原因下降或意识模糊，请立即就医。

  血常规:
    desc: 评估红细胞、白细胞、血小板三大系的常规检查
    unit: 计数
    normal: 白细胞 4–10 ×10⁹/L 等（综合判读）
    ranges:
      - {max: 3.5, label: 白细胞偏低, text: 白细胞低于常见参考下限，可能与病毒感染、药物或血液系统因素有关。}
      - {min: 10, label: 白细胞偏高, text: 白细胞高于常见参考上限，常见于细菌感染或应激状态。}
    advice_common:
      - 单项异常建议结合其他指标与症状由医生综合判读，一般不必自行处理

  肝功能:
    desc: 反映肝脏合成与代谢功能的指标组合
    unit: U/L
    normal: ALT 7–40 等（综合判读）
    ranges:
      - {max: 40, label: 正常, text: 转氨酶在常见参考范围内。}
      - {min: 40, label: 转氨酶偏高, text: 高于常见参考上限，可能与脂肪肝、饮酒、药物或肝脏炎症有关。}
    advice_common:
      - 复查前建议避免饮酒与熬夜；若持续升高请挂消化内科/肝病门诊

  肾功能:
    desc: 评估肾脏滤过与排泄功能的指标组合
    unit: µmol/L
    normal: 肌酐 44–104（综合判读）
    ranges:
      - {max: 104, label: 正常, text: 肌酐在常见参考范围内。}
      - {min: 104, label: 肌酐偏高, text: 高于常见参考上限，可能与脱水、肾脏负担或肾功能异常有关。}
    advice_common:
      - 复查前保持正常饮水；持续偏高请挂肾内科

  血脂:
    desc: 评估血液中脂类水平，与心血管风险相关
    unit: mmol/L
    normal: 总胆固醇 < 5.2（综合判读）
    ranges:
      - {max: 5.2, label: 正常, text: 总胆固醇在常见参考范围内。}
      - {min: 5.2, label: 偏高, text: 高于常见参考上限，长期偏高会增加动脉粥样硬化风险。}
    advice_common:
      - 建议控制油脂摄入、增加运动；必要时挂心血管内科/内分泌科评估

  尿常规:
    desc: 尿液物理、化学与镜下成分的快速筛查
    unit: 半定量
    normal: 各项阴性（-）
    ranges:
      - {min: 0, label: 已出结果, text: 尿常规为半定量筛查，单项阳性需结合临床判读。}
    advice_common:
      - 如有尿蛋白/尿糖/红细胞阳性，建议挂肾内科或内分泌科复查

medications:
  阿司匹林:
    purpose: 抗血小板、预防血栓，常用于心脑血管疾病二级预防
    usage: 一般每日一次，遵医嘱剂量
    caution: 有消化道出血史或胃溃疡者需告知医生；出现黑便、牙龈出血不止请停药并就医
    note: 不宜与其他抗凝药自行联用
  二甲双胍:
    purpose: 降血糖，2型糖尿病一线用药
    usage: 随餐或餐后服用，减少胃肠反应
    caution: 极少数情况可能出现胃肠不适；肾功能不全者需医生评估
    note: 如出现反复呕吐、腹泻脱水，请暂停并就医
  氨氯地平:
    purpose: 降血压（钙通道阻滞剂）
    usage: 一般每日一次，晨起或固定时间服用
    caution: 部分人初期可能出现踝部水肿、面部潮红，通常可自行缓解
    note: 勿自行停药或加量，规律复测血压
  奥美拉唑:
    purpose: 抑制胃酸，用于胃酸相关疾病
    usage: 一般晨起空腹服用
    caution: 长期使用需医生评估；出现严重腹泻请告知医生
    note: 与其他药同服建议间隔时间并咨询医生
  布洛芬:
    purpose: 解热镇痛抗炎
    usage: 一般每次1片，每日不超过3次，饭后服用
    caution: 消化道溃疡者慎用；不要与同类止痛药叠加
    note: 连续使用超过3天仍不缓解，请就医
  头孢呋辛:
    purpose: 抗菌消炎（头孢类抗生素）
    usage: 按医嘱足量足疗程，不可自行停药
    caution: 对头孢/青霉素过敏者禁用；服药期间及停药一周内勿饮酒
    note: 如出现皮疹、呼吸困难应立即停药就医

symptoms:
  - {keys: ["胸痛", "胸闷", "心慌"], department: 心血管内科, severe: 中度, text: 胸闷胸痛需排查心脏问题，尤其是活动后加重、休息缓解的类型。}
  - {keys: ["头晕", "头痛", "眩晕"], department: 神经内科, severe: 轻度, text: 头晕头痛原因多样，需要结合血压、睡眠与发作特点判断。}
  - {keys: ["胃痛", "腹痛", "反酸", "胃胀"], department: 消化内科, severe: 轻度, text: 消化道症状建议先做腹部相关检查，避免自行吃止痛药掩盖病情。}
  - {keys: ["咳嗽", "咳痰", "发热", "咽痛", "感冒", "流鼻涕"], department: 呼吸内科, severe: 轻度, text: 呼吸道症状伴发热时注意休息与饮水，症状加重需就医。}
  - {keys: ["腰疼", "关节痛", "骨痛"], department: 骨科, severe: 轻度, text: 骨关节疼痛建议专科查体，必要时影像检查明确原因。}
  - {keys: ["水肿", "尿少", "乏力"], department: 肾内科, severe: 中度, text: 水肿与乏力可能与心、肾、营养等多因素有关，建议系统评估。}
  - {keys: ["失眠", "焦虑", "情绪低落"], department: 心理科/神经内科, severe: 轻度, text: 睡眠与情绪问题建议规律作息，必要时专科评估。}
  - {keys: ["便血", "黑便"], department: 消化内科, severe: 高度, text: 消化道出血需要尽快就医。}

diseases:
  糖尿病:
    what: 血液中葡萄糖水平长期偏高的慢性代谢病，分1型与2型，2型更为常见。
    advice: 核心管理是饮食、运动、用药三件事；定期监测血糖与糖化血红蛋白；每年检查眼底、尿蛋白与足部。
    keywords: ["糖尿病", "血糖高", "2型糖尿病"]
  高血压:
    what: 血压长期高于正常范围的慢性病，多数早期无明显症状，被称为"沉默的杀手"。
    advice: 家庭自测血压记录趋势；低盐饮食、规律作息；遵医嘱服药，勿自行停药。
    keywords: ["高血压", "血压高"]
  高血脂:
    what: 血液中胆固醇/甘油三酯水平升高，是动脉粥样硬化的重要风险因素。
    advice: 控制饱和脂肪摄入、增加运动；必要时药物干预并按医嘱复查。
    keywords: ["高血脂", "血脂高", "胆固醇高"]
  支气管炎:
    what: 支气管黏膜的炎症，常表现为咳嗽、咳痰，急性或慢性均可发生。
    advice: 急性期注意休息、多饮水；慢性者避免吸烟与冷空气刺激。
    keywords: ["支气管炎", "咳嗽", "气管炎"]
  胃炎:
    what: 胃黏膜的炎症，表现为上腹不适、反酸、胃胀等。
    advice: 规律三餐、避免辛辣刺激与空腹饮酒；症状反复建议胃镜检查。
    keywords: ["胃炎", "胃病", "胃疼", "胃痛"]
  上呼吸道感染:
    what: 俗称"感冒"，多为病毒引起，通常7–10天自愈。
    advice: 多休息、多饮水；高热不退或症状加重超过一周需就医。
    keywords: ["感冒", "上呼吸道感染", "流感"]