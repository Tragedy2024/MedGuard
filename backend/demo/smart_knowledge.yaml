# acuity 见文件头说明。胸痛/胸闷/心慌 与 便血/黑便 是明确的红旗信号
# （ESI v4 决策点 B「高危」、Schmitt-Thompson 的 Emergent 档）→ 2 级；
# 水肿/尿少/乏力 需系统评估但非即刻危及 → 3 级；其余 → 4 级。
#
# v1 的 `keys` 在 v2 里统一改名为 `aliases`（语义不变）。
symptoms:
  - id: symptom_chest
    aliases: [胸痛, 胸闷, 心慌, 胸口疼, 胸口痛, 心里发慌, 发慌]
    provenance: {reviewed: true, source: 医院审核知识库}
    department: 心血管内科
    acuity: 2
    text: 胸闷胸痛需排查心脏问题，尤其是活动后加重、休息缓解的类型。
  - id: symptom_dizziness
    aliases: [头晕, 头痛, 眩晕, 脑袋晕, 头昏, 晕得慌]
    provenance: {reviewed: true, source: 医院审核知识库}
    department: 神经内科
    acuity: 4
    text: 头晕头痛原因多样，需要结合血压、睡眠与发作特点判断。
  - id: symptom_stomach
    aliases: [胃痛, 胃疼, 腹痛, 反酸, 胃胀, 肚子疼, 肚子痛]
    provenance: {reviewed: true, source: 医院审核知识库}
    department: 消化内科
    acuity: 4
    text: 消化道症状建议先做腹部相关检查，避免自行吃止痛药掩盖病情。
  - id: symptom_respiratory
    aliases: [咳嗽, 咳痰, 发热, 咽痛, 感冒, 流鼻涕, 发烧, 低烧, 嗓子疼, 流涕]
    provenance: {reviewed: true, source: 医院审核知识库}
    department: 呼吸内科
    acuity: 4
    text: 呼吸道症状伴发热时注意休息与饮水，症状加重需就医。
  - id: symptom_bone
    aliases: [腰疼, 关节痛, 骨痛, 腰痛, 腰酸, 关节疼]
    provenance: {reviewed: true, source: 医院审核知识库}
    department: 骨科
    acuity: 4
    text: 骨关节疼痛建议专科查体，必要时影像检查明确原因。
  - id: symptom_edema
    aliases: [水肿, 尿少, 乏力, 浮肿, 没劲]
    provenance: {reviewed: true, source: 医院审核知识库}
    department: 肾内科
    acuity: 3
    text: 水肿与乏力可能与心、肾、营养等多因素有关，建议系统评估。
  - id: symptom_mood
    aliases: [失眠, 焦虑, 情绪低落, 睡不着, 睡不好, 入睡困难]
    provenance: {reviewed: true, source: 医院审核知识库}
    # 这里的复合写法（`心理科/神经内科`）是 v1 原样保留的展示文案，
    # 会直接渲染成「建议优先咨询心理科/神经内科」。**不要为了对齐科室表
    # 而简化它**——那是行为变更，不是结构调整。科室表的守卫测试对复合值
    # 按「/」拆分后分别校验。
    department: 心理科/神经内科
    acuity: 4
    text: 睡眠与情绪问题建议规律作息，必要时专科评估。
  - id: symptom_gi_bleed
    aliases: [便血, 黑便, 大便带血, 血便, 柏油便]
    provenance: {reviewed: true, source: 医院审核知识库}
    department: 消化内科
    acuity: 2
    text: 消化道出血需要尽快就医。

  # ── 以下为 2026-09-21 扩写的症状簇 ────────────────────────────
  - id: symptom_skin
    aliases: [皮肤瘙痒, 皮肤痒, 皮疹, 起疹子]
    provenance: {reviewed: true, source: 医院审核知识库}
    department: 皮肤科
    acuity: 4
    text: 皮肤问题建议避免搔抓与热水烫洗，记录可能的诱因（食物、药物、接触物）。
  - id: symptom_vision
    aliases: [视力模糊, 视物模糊, 看东西模糊, 眼睛干涩]
    provenance: {reviewed: true, source: 医院审核知识库}
    department: 眼科
    acuity: 3
    text: 视力变化需尽快明确原因；若突然视力下降或伴眼痛，请立即就医。
  - id: symptom_tinnitus
    aliases: [耳鸣, 耳朵响]
    provenance: {reviewed: true, source: 医院审核知识库}
    department: 耳鼻喉科
    acuity: 4
    text: 耳鸣原因多样，建议同时关注听力变化与血压情况。
  - id: symptom_constipation
    aliases: [便秘, 排便困难, 大便干结]
    provenance: {reviewed: true, source: 医院审核知识库}
    department: 消化内科
    acuity: 4
    text: 增加膳食纤维与饮水、规律排便是基础；持续改变需排除器质性问题。
  - id: symptom_nasal
    aliases: [鼻塞, 打喷嚏, 流鼻血]
    provenance: {reviewed: true, source: 医院审核知识库}
    department: 耳鼻喉科
    acuity: 4
    text: 鼻部症状常见于过敏或感染；反复单侧鼻出血需专科检查。
  - id: symptom_urinary
    aliases: [尿频, 尿急, 尿痛]
    provenance: {reviewed: true, source: 医院审核知识库}
    department: 泌尿外科
    acuity: 4
    text: 排尿不适多与感染相关，建议多饮水并尽早查尿常规。
  - id: symptom_hemoptysis
    aliases: [咯血, 咳血, 痰中带血]
    provenance: {reviewed: true, source: 医院审核知识库}
    department: 呼吸内科
    acuity: 2
    text: 咯血需要尽快明确来源，量多或伴呼吸困难请立即就医。
  - id: symptom_joint_swelling
    aliases: [关节红肿, 关节肿胀]
    provenance: {reviewed: true, source: 医院审核知识库}
    department: 风湿免疫科
    acuity: 3
    text: 关节红肿提示存在炎症，建议尽早专科评估，避免自行长期服用止痛药。

# v1 的 `keywords` 在 v2 里统一改名为 `aliases`（语义不变）。
#
# `relations` 三种类型的来源不同，**不要混为一谈**：
#   · 就诊科室 —— 原始 6 条来自 OpenCMKG 的 `disease_belong_department`
#     （见 .scratch/knowledge-sources/sources.md，抽检 5/5 正确）；
#     2026-09-21 扩写的 19 条为仿真数据。
#   · 相关检验 / 常用药物 —— **本次扩写新增的仿真数据**，没有外部来源。
#     它们是"知识图谱"的边：让「疾病 → 该查什么 → 该用什么」可以多跳。
#     当前没有代码消费它们（多跳是后续阶段的事），先按结构补齐。
diseases:
  糖尿病:
    id: disease_diabetes
    aliases: [糖尿病, 血糖高, 2型糖尿病]
    provenance: {reviewed: true, source: 医院审核知识库}
    what: 血液中葡萄糖水平长期偏高的慢性代谢病，分1型与2型，2型更为常见。
    advice: 核心管理是饮食、运动、用药三件事；定期监测血糖与糖化血红蛋白；每年检查眼底、尿蛋白与足部。
    relations:
      - {type: 就诊科室, target: 内分泌科}
      - {type: 相关检验, target: lab_glucose}
      - {type: 相关检验, target: lab_hba1c}
      - {type: 相关检验, target: lab_urine}
      - {type: 常用药物, target: drug_metformin}
  高血压:
    id: disease_hypertension
    aliases: [高血压, 血压高]
    provenance: {reviewed: true, source: 医院审核知识库}
    what: 血压长期高于正常范围的慢性病，多数早期无明显症状，被称为"沉默的杀手"。
    advice: 家庭自测血压记录趋势；低盐饮食、规律作息；遵医嘱服药，勿自行停药。
    relations:
      - {type: 就诊科室, target: 心血管内科}
      - {type: 相关检验, target: lab_lipid}
      - {type: 相关检验, target: lab_kidney}
      - {type: 常用药物, target: drug_amlodipine}
      - {type: 常用药物, target: drug_valsartan}
  高血脂:
    id: disease_hyperlipidemia
    aliases: [高血脂, 血脂高, 胆固醇高]
    provenance: {reviewed: true, source: 医院审核知识库}
    what: 血液中胆固醇/甘油三酯水平升高，是动脉粥样硬化的重要风险因素。
    advice: 控制饱和脂肪摄入、增加运动；必要时药物干预并按医嘱复查。
    relations:
      - {type: 就诊科室, target: 心血管内科}
      - {type: 相关检验, target: lab_lipid}
      - {type: 相关检验, target: lab_liver}
      - {type: 常用药物, target: drug_atorvastatin}
  支气管炎:
    id: disease_bronchitis
    aliases: [支气管炎, 咳嗽, 气管炎]
    provenance: {reviewed: true, source: 医院审核知识库}
    what: 支气管黏膜的炎症，常表现为咳嗽、咳痰，急性或慢性均可发生。
    advice: 急性期注意休息、多饮水；慢性者避免吸烟与冷空气刺激。
    relations:
      - {type: 就诊科室, target: 呼吸内科}
      - {type: 相关检验, target: lab_cbc}
      - {type: 相关检验, target: lab_crp}
      - {type: 常用药物, target: drug_amoxicillin}
  胃炎:
    id: disease_gastritis
    aliases: [胃炎, 胃病, 胃疼, 胃痛]
    provenance: {reviewed: true, source: 医院审核知识库}
    what: 胃黏膜的炎症，表现为上腹不适、反酸、胃胀等。
    advice: 规律三餐、避免辛辣刺激与空腹饮酒；症状反复建议胃镜检查。
    relations:
      - {type: 就诊科室, target: 消化内科}
      - {type: 相关检验, target: lab_cbc}
      - {type: 常用药物, target: drug_omeprazole}
      - {type: 常用药物, target: drug_rabeprazole}
  上呼吸道感染:
    id: disease_uri
