# 智慧医生 · 医院审核知识库（v2）
#
# 角色定位：这是"医院审核的医学知识"——由医院专业人员审核定稿的静态
# 知识，不是模型生成的内容。智慧医生把「院内数据」与「知识库解读」并列
# 展示并分别标注来源，正是产品差异点（智慧医生.docx）。
#
# 本文件覆盖演示库中出现的全部检验项 / 药品 / 常见症状 / 常见诊断。
#
# ── v2 相对 v1 的变化（**只改结构，不改内容语义**）─────────────────
#
#   1. 每个内容条目新增 `id`        —— relations 的稳定引用目标
#   2. 每个内容条目新增 `aliases`   —— 字面检索的燃料
#      （v1 里同一个概念有三个名字：diseases 用 `keywords`、symptoms 用
#        `keys`、lab_tests 与 medications 则完全没有。v2 统一为 `aliases`。）
#   3. 每个内容条目新增 `provenance` —— 来源标注
#      （「医院审核知识库」这六个字从此只出现在**真被审过**的条目上）
#   4. 新增 `departments` 段        —— 科室成为一等条目，可被检索、可作 relations 目标
#   5. 新增 `relations`             —— 图上的边（多跳的载体）
#
# ── 关于 relations 的一条约定 ─────────────────────────────────
#
#   **relations 只写「现有字段没有表达的关系」。**
#   症状→科室已由 `symptoms[].department` 字段表达，故**不在此重复**——
#   同一事实存两处必然漂移。语料加载层负责把该字段合成为一条边。
#
# ── 数值区间（v1 原样保留）────────────────────────────────────
#
#   normal 为展示用参考范围；
#   ranges 按 result_value 数值分档（max 表示 <=max，min 表示 >=min，
#   档位从上到下匹配，任一命中即止）；
#   acuity 为分诊等级，对齐国内「三区四级」（WS/T 390-2012《医院急诊科
#   规范化流程》）：1 濒危（即刻）／2 危重（10 分钟内）／3 急症（30 分钟
#   内）／4 非急症。**只有 1、2 级弹急诊横幅**——把"人人弹警告"压下去，
#   真急症信号才不会被稀释。每条分档与症状都必须显式写出 acuity。
#
#   注意 urgent_text 与 acuity 是两回事：前者是 safety-net 提示（Schmitt-
#   Thompson 体系的写法，"若同时出现…请立即就医"），无条件展示，不表示
#   本次回答紧急；后者才决定是否弹横幅。

version: 2

# ── 科室 ──────────────────────────────────────────────────────
#
# 为什么科室要独立成段：演示业务库写的是 `心内科`，而本文件 v1 的症状条目
# 写的是 `心血管内科` —— 同一件事两个名字，对检索是硬伤。科室条目带
# aliases 之后，两个写法都能命中同一个科室。
#
# 科室是**分类法**不是知识条目，故不带 provenance。
departments:
  心血管内科:
    aliases: [心血管内科, 心内科, 心脏内科]
  内分泌科:
    aliases: [内分泌科]
  神经内科:
    aliases: [神经内科]
  消化内科:
    aliases: [消化内科]
  呼吸内科:
    aliases: [呼吸内科, 呼吸科]
  骨科:
    aliases: [骨科, 骨外科]
  肾内科:
    aliases: [肾内科]
  心理科:
    aliases: [心理科, 精神科, 心理门诊]
  皮肤科:
    aliases: [皮肤科]
  眼科:
    aliases: [眼科, 眼科门诊]
  耳鼻喉科:
    aliases: [耳鼻喉科, 耳鼻咽喉科, 五官科]
  泌尿外科:
    aliases: [泌尿外科, 泌尿科]
  风湿免疫科:
    aliases: [风湿免疫科, 风湿科]
  血液科:
    aliases: [血液科, 血液内科]

lab_tests:
  血糖:
    id: lab_glucose
    # ⚠️ **不要加单字别名 `糖`**：`糖尿病` 里含 `糖`，加了之后
    # 「糖尿病怎么办」会被本条目抢走——parse_intent 的 swallowed 判据是
    # 「检验名是否落在疾病名里」，而 `血糖` 不在 `糖尿病` 里，挡不住。
    # 这正是"单字别名"的典型风险：`肝`/`肾` 能用，是因为知识库里没有
    # 别的"肝/肾"条目可以冲突；`糖` 有。
    aliases: [血糖, 空腹血糖, 餐后血糖, 葡萄糖, 空腹葡萄糖, 血糖值, 血糖水平]
    provenance: {reviewed: true, source: 医院审核知识库}
    desc: 反映血液中的葡萄糖浓度，糖尿病诊断与随访的核心指标
    unit: mmol/L
    normal: 3.9–6.1（空腹）
    ranges:
      # 相邻档位的切点用 3.89 / 6.99 而非 3.9 / 7.0：interpret_lab 是「闭区间
      # lo<=v<=hi + 首个命中即止」，两档若在同一切点上都满足，切点会被上一档
      # 吃掉（3.9 判成「偏低」、7.0 判成「空腹血糖受损」）。检验值固定一位
      # 小数，故取 0.01 的错位，让 3.9 归「正常」、7.0 归「显著偏高」。
      - {max: 3.89, acuity: 4, label: 偏低, text: 低于空腹正常下限，可能是空腹时间过长、饮食不足或药物影响，也可能提示低血糖。}
      - {min: 3.9, max: 6.1, acuity: 4, label: 正常, text: 在空腹正常范围内，本次结果未见异常。}
      - {min: 6.1, max: 6.99, acuity: 4, label: 偏高（空腹血糖受损）, text: 高于正常上限但未达糖尿病诊断标准，提示空腹血糖受损，属于糖尿病前期信号。}
      - {min: 7.0, acuity: 3, label: 显著偏高, text: 达到糖尿病诊断参考标准，建议由内分泌科医生复核并安排进一步检查（如糖化血红蛋白、糖耐量试验）。}
    advice_common:
      - 如为复查，请与上次结果对比趋势；连续偏高建议记录饮食与用药情况
    urgent_text: 若同时出现明显口渴、多饮多尿、体重不明原因下降或意识模糊，请立即就医。

  血常规:
    id: lab_cbc
    aliases: [血常规, 血象, 血细胞分析, 全血细胞计数]
    provenance: {reviewed: true, source: 医院审核知识库}
    desc: 评估红细胞、白细胞、血小板三大系的常规检查
    unit: 计数
    normal: 白细胞 4–10 ×10⁹/L 等（综合判读）
    ranges:
      - {max: 3.5, acuity: 4, label: 白细胞偏低, text: 白细胞低于常见参考下限，可能与病毒感染、药物或血液系统因素有关。}
      - {min: 3.5, max: 10, acuity: 4, label: 正常, text: 白细胞在常见参考范围内，本次结果未见异常。}
      - {min: 10, acuity: 4, label: 白细胞偏高, text: 白细胞高于常见参考上限，常见于细菌感染或应激状态。}
    advice_common:
      - 单项异常建议结合其他指标与症状由医生综合判读，一般不必自行处理

  肝功能:
    id: lab_liver
    # `肝` 是单字别名，属**刻意放宽**：知识库里没有任何其他与"肝"相关的
    # 条目，所以它只会指向肝功能，不会被别处抢走。没有它，「查一下肝」
    # 这类口语问法只能答"我没听懂"。
    aliases: [肝功能, 肝功, 转氨酶, 肝脏功能, 肝]
    provenance: {reviewed: true, source: 医院审核知识库}
    desc: 反映肝脏合成与代谢功能的指标组合
    unit: U/L
    normal: ALT 7–40 等（综合判读）
    ranges:
      - {max: 40, acuity: 4, label: 正常, text: 转氨酶在常见参考范围内。}
      - {min: 40, acuity: 4, label: 转氨酶偏高, text: 高于常见参考上限，可能与脂肪肝、饮酒、药物或肝脏炎症有关。}
    advice_common:
      - 复查前建议避免饮酒与熬夜；若持续升高请挂消化内科/肝病门诊

  肾功能:
    id: lab_kidney
    # `肾` 同 `肝`，见上。
    aliases: [肾功能, 肾功, 肌酐, 肾脏功能, 肾]
    provenance: {reviewed: true, source: 医院审核知识库}
    desc: 评估肾脏滤过与排泄功能的指标组合
    unit: µmol/L
    normal: 肌酐 44–104（综合判读）
    ranges:
      - {max: 104, acuity: 4, label: 正常, text: 肌酐在常见参考范围内。}
      - {min: 104, acuity: 4, label: 肌酐偏高, text: 高于常见参考上限，可能与脱水、肾脏负担或肾功能异常有关。}
    advice_common:
      - 复查前保持正常饮水；持续偏高请挂肾内科

  血脂:
    id: lab_lipid
    aliases: [血脂, 血脂四项, 胆固醇, 甘油三酯]
    provenance: {reviewed: true, source: 医院审核知识库}
    desc: 评估血液中脂类水平，与心血管风险相关
    unit: mmol/L
    normal: 总胆固醇 < 5.2（综合判读）
    ranges:
      - {max: 5.2, acuity: 4, label: 正常, text: 总胆固醇在常见参考范围内。}
      - {min: 5.2, acuity: 4, label: 偏高, text: 高于常见参考上限，长期偏高会增加动脉粥样硬化风险。}
    advice_common:
      - 建议控制油脂摄入、增加运动；必要时挂心血管内科/内分泌科评估

  尿常规:
    id: lab_urine
    aliases: [尿常规, 尿检, 尿液检查]
    provenance: {reviewed: true, source: 医院审核知识库}
    desc: 尿液物理、化学与镜下成分的快速筛查
    unit: 半定量
    normal: 各项阴性（-）
    ranges:
      - {min: 0, acuity: 4, label: 已出结果, text: 尿常规为半定量筛查，单项阳性需结合临床判读。}
    advice_common:
      - 如有尿蛋白/尿糖/红细胞阳性，建议挂肾内科或内分泌科复查

  # ── 以下为 2026-09-21 扩写的检验项 ────────────────────────────
  #
  # ⚠️ **它们在演示库里没有对应的化验记录**（seed 只生成上面 6 项）。
  # 患者问起时会得到「未找到检验记录」——那是诚实行为，不是故障。
  # 它们当前的主要作用是**作为 `相关检验` 关系的目标**，把知识图谱接起来。
  # 要让它们真正可查，需要另行扩写 demo/seed.py（会移动随机流，风险另评）。
  糖化血红蛋白:
    id: lab_hba1c
    aliases: [糖化血红蛋白, 糖化血红蛋白A1c, HbA1c]
    provenance: {reviewed: true, source: 医院审核知识库}
    desc: 反映近 2–3 个月平均血糖水平，糖尿病长期控制的核心指标
    unit: "%"
    normal: 4–6
    ranges:
      - {max: 5.99, acuity: 4, label: 正常, text: 在常见参考范围内，提示近三个月血糖控制尚可。}
      - {min: 6.0, max: 6.49, acuity: 4, label: 偏高, text: 略高于参考上限，提示近期血糖控制欠佳，建议复查空腹血糖。}
      - {min: 6.5, acuity: 3, label: 显著偏高, text: 达到糖尿病诊断参考水平，建议由内分泌科医生复核并调整治疗方案。}
    advice_common:
      - 该指标不受单次饮食影响，无需空腹；反映的是长期趋势

  C反应蛋白:
    id: lab_crp
    aliases: [C反应蛋白, 超敏C反应蛋白, CRP]
    provenance: {reviewed: true, source: 医院审核知识库}
    desc: 反映体内炎症水平的急性期指标
    unit: mg/L
    normal: < 8
    ranges:
      - {max: 7.99, acuity: 4, label: 正常, text: 在常见参考范围内，未见明显炎症反应。}
      - {min: 8, max: 39.99, acuity: 4, label: 轻度升高, text: 提示可能存在轻度感染或炎症，建议结合症状与其他指标判读。}
      - {min: 40, acuity: 3, label: 明显升高, text: 提示存在较明显的感染或炎症反应，建议尽快就医明确病因。}
    advice_common:
      - 单项升高不能定位病灶，需结合症状、血常规与影像检查综合判断

  尿酸:
    id: lab_uric
    aliases: [尿酸, 血尿酸]
    provenance: {reviewed: true, source: 医院审核知识库}
    desc: 嘌呤代谢的终产物，与痛风及肾脏负担相关
    unit: µmol/L
    normal: 男性 208–428；女性 155–357（综合判读）
    ranges:
      - {max: 427, acuity: 4, label: 正常, text: 在常见参考范围内。}
      - {min: 428, max: 539, acuity: 4, label: 偏高, text: 高于常见参考上限，建议减少高嘌呤饮食与饮酒，定期复查。}
      - {min: 540, acuity: 4, label: 显著偏高, text: 明显高于参考范围，痛风与尿路结石风险升高，建议由风湿免疫科或内分泌科评估。}
    advice_common:
      - 复查前避免饮酒、动物内脏与海鲜；多饮水有助于排泄

  促甲状腺激素:
    id: lab_tsh
    aliases: [促甲状腺激素, 甲状腺功能, 甲功, TSH]
    provenance: {reviewed: true, source: 医院审核知识库}
    desc: 反映甲状腺功能状态的核心筛查指标
    unit: mIU/L
    normal: 0.35–4.94
    ranges:
      - {max: 0.34, acuity: 4, label: 偏低, text: 低于常见参考下限，可能提示甲状腺功能偏亢，建议结合甲状腺激素指标判读。}
      - {min: 0.35, max: 4.94, acuity: 4, label: 正常, text: 在常见参考范围内。}
      - {min: 4.95, acuity: 4, label: 偏高, text: 高于常见参考上限，可能提示甲状腺功能减退，建议由内分泌科评估。}
    advice_common:
      - 甲功判读需与 FT3、FT4 一起看，单项异常未必代表疾病

  血钾:
    id: lab_potassium
    aliases: [血钾, 钾离子]
    provenance: {reviewed: true, source: 医院审核知识库}
    desc: 维持心脏与神经肌肉功能的关键电解质
    unit: mmol/L
    normal: 3.5–5.3
    ranges:
      - {max: 3.49, acuity: 3, label: 偏低, text: 低于常见参考下限，可能引起乏力、心悸，建议尽快就医评估。}
      - {min: 3.5, max: 5.3, acuity: 4, label: 正常, text: 在常见参考范围内。}
      - {min: 5.31, acuity: 2, label: 偏高, text: 高于常见参考上限，可能影响心律，请尽快就医。}
    advice_common:
      - 服用利尿剂或部分降压药者尤其需要关注血钾
    urgent_text: 若同时出现明显心悸、四肢无力或心律不齐，请立即就医。

  肌钙蛋白:
    id: lab_troponin
    aliases: [肌钙蛋白, 心肌酶, cTnI]
    provenance: {reviewed: true, source: 医院审核知识库}
    desc: 心肌损伤的特异性标志物
    unit: ng/mL
    normal: < 0.04
    ranges:
      - {max: 0.039, acuity: 4, label: 正常, text: 在常见参考范围内，未见心肌损伤证据。}
      - {min: 0.04, acuity: 1, label: 升高, text: 高于常见参考上限，提示可能存在心肌损伤，请立即就医。}
    advice_common:
      - 该指标升高需结合心电图与症状，由急诊或心血管内科判读
    urgent_text: 若同时出现胸痛、胸闷、大汗或呼吸困难，请立即拨打急救电话。

medications:
  阿司匹林:
    id: drug_aspirin
    aliases: [阿司匹林, 乙酰水杨酸]
    provenance: {reviewed: true, source: 医院审核知识库}
    purpose: 抗血小板、预防血栓，常用于心脑血管疾病二级预防
    usage: 一般每日一次，遵医嘱剂量
    caution: 有消化道出血史或胃溃疡者需告知医生；出现黑便、牙龈出血不止请停药并就医
    note: 不宜与其他抗凝药自行联用
  二甲双胍:
    id: drug_metformin
    aliases: [二甲双胍, 盐酸二甲双胍]
    provenance: {reviewed: true, source: 医院审核知识库}
    purpose: 降血糖，2型糖尿病一线用药
    usage: 随餐或餐后服用，减少胃肠反应
    caution: 极少数情况可能出现胃肠不适；肾功能不全者需医生评估
    note: 如出现反复呕吐、腹泻脱水，请暂停并就医
  氨氯地平:
    id: drug_amlodipine
    aliases: [氨氯地平, 苯磺酸氨氯地平]
    provenance: {reviewed: true, source: 医院审核知识库}
    purpose: 降血压（钙通道阻滞剂）
    usage: 一般每日一次，晨起或固定时间服用
    caution: 部分人初期可能出现踝部水肿、面部潮红，通常可自行缓解
    note: 勿自行停药或加量，规律复测血压
  奥美拉唑:
    id: drug_omeprazole
    aliases: [奥美拉唑, 奥美拉唑镁]
    provenance: {reviewed: true, source: 医院审核知识库}
    purpose: 抑制胃酸，用于胃酸相关疾病
    usage: 一般晨起空腹服用
    caution: 长期使用需医生评估；出现严重腹泻请告知医生
    note: 与其他药同服建议间隔时间并咨询医生
  布洛芬:
    id: drug_ibuprofen
    aliases: [布洛芬]
    provenance: {reviewed: true, source: 医院审核知识库}
    purpose: 解热镇痛抗炎
    usage: 一般每次1片，每日不超过3次，饭后服用
    caution: 消化道溃疡者慎用；不要与同类止痛药叠加
    note: 连续使用超过3天仍不缓解，请就医
  头孢呋辛:
    id: drug_cefuroxime
